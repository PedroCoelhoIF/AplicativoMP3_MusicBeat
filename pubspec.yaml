name: appmp3_musicbeat
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Áudio 
  just_audio: ^0.9.36

  # Network & Download
  http: ^1.1.0
  dio: ^5.4.0
  path_provider: ^2.1.1

  # Utilities
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2

  # Localização
  geolocator: ^10.1.0

  # Ícones do app
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# Configuração do flutter_launcher_icons
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"